<section class="playground">
  <h2>Playground</h2>

  <!-- Interactive index.html fragment with color scheme toggle -->
  <div class="code-with-toggle">
    <interactive-code language="html" (change)="onBindingChange($event)"><textarea>
<!-- index.html -->
<body class="${darkMode}">
  ...
</body></textarea>
      <code-binding key="darkMode" options="light,dark" type="select" [value]="isDarkMode() ? 'dark' : 'light'"></code-binding>
    </interactive-code>
    <button class="color-scheme-toggle" (click)="toggleColorScheme()" [title]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (isDarkMode()) {<mat-icon>light_mode</mat-icon>} @else {<mat-icon>dark_mode</mat-icon>}
    </button>
  </div>

  <!-- Interactive HTML Code - mat-table version -->
  <div class="code-with-toggle">
  @if (!isNativeTable()) {
    <interactive-code language="html" (change)="onBindingChange($event)"><textarea>
<!-- your-component.html -->
<mat-table>
  ...
  <mat-row>
    ...
    <mat-cell>  <!-- Toolbar from LEFT -->
      <span rowActions [disabled]="${leftDisabled}">
        <button matIconButton>...</button>
      </span>
      &#123;&#123; user.name &#125;&#125;
    </mat-cell>
    ...
    <mat-cell>  <!-- Toolbar from RIGHT -->
      &#123;&#123; user.lastUpdated &#125;&#125;
      <span rowActions="${variant}" [disabled]="${rightDisabled}">
        <button matIconButton>...</button>
      </span>
    </mat-cell>
  </mat-row>
  ...
</mat-table></textarea>
      <code-binding key="nativeTable" type="boolean" value="false"></code-binding>
      <code-binding key="leftDisabled" type="boolean" value="false"></code-binding>
      <code-binding key="rightDisabled" type="boolean" value="false"></code-binding>
      <code-binding key="variant" type="select" carousel value="" options=",filled,tonal"></code-binding>
    </interactive-code>
  } @else {
    <interactive-code language="html" (change)="onBindingChange($event)"><textarea>
<!-- your-component.html -->
<table mat-table>
  ...
  <tr mat-row>
    ...
    <td mat-cell>  <!-- Toolbar from LEFT -->
      <span rowActions [disabled]="${leftDisabled}">
        <button matIconButton>...</button>
      </span>
      &#123;&#123; user.name &#125;&#125;
    </td>
    ...
    <td mat-cell>  <!-- Toolbar from RIGHT -->
      &#123;&#123; user.lastUpdated &#125;&#125;
      <span rowActions="${variant}" [disabled]="${rightDisabled}">
        <button matIconButton>...</button>
      </span>
    </td>
  </tr>
  ...
</table></textarea>
      <code-binding key="nativeTable" type="boolean" value="true"></code-binding>
      <code-binding key="leftDisabled" type="boolean" value="false"></code-binding>
      <code-binding key="rightDisabled" type="boolean" value="false"></code-binding>
      <code-binding key="variant" type="select" carousel value="" options=",filled,tonal"></code-binding>
    </interactive-code>
  }
  <button class="table-syntax-toggle" (click)="toggleTableSyntax()" [title]="isNativeTable() ? 'Switch to &lt;mat-table&gt;' : 'Switch to &lt;table mat-table&gt;'">
    @if (isNativeTable()) {<mat-icon>grid_on</mat-icon>} @else {<mat-icon>table_chart</mat-icon>}
  </button>
  </div>

  <div class="table-preview-wrapper">
    @if (isNativeTable()) {
      @defer (on idle) {
        <app-table-preview-native
          [leftDisabled]="leftDisabled()"
          [rightDisabled]="rightDisabled()"
          [variant]="selectedVariant()"
        />
      } @placeholder (minimum 1000ms) {
        <div class="table-placeholder">
          <loading-indicator withContainer diameter="64"/>
        </div>
      }
    } @else {
      @defer (on idle) {
        <app-table-preview
          [leftDisabled]="leftDisabled()"
          [rightDisabled]="rightDisabled()"
          [variant]="selectedVariant()"
        />
      } @placeholder (minimum 1000ms) {
        <div class="table-placeholder">
          <loading-indicator withContainer diameter="64"/>
        </div>
      }
    }
  </div>

  <!-- Interactive SCSS Code -->
  <interactive-code language="scss" (change)="onBindingChange($event)"><textarea>
// In styles.scss
@use '@angular/material' as mat;
@use '@softwarity/row-actions/row-actions-theme' as row-actions;

html {
  color-scheme: light;
  @include mat.theme((color: mat.$${palette}-palette));
  @include mat.table-overrides((row-item-container-height: ${rowHeight}px));

  & body.dark-mode {
    color-scheme: dark;
  }

  @include row-actions.overrides((
    ${containerEnabled}container-background-color: light-dark(${containerLight}, ${containerDark}),
    ${filledEnabled}filled-background-color: light-dark(${filledLight}, ${filledDark}),
    ${tonalEnabled}tonal-background-color: light-dark(${tonalLight}, ${tonalDark})
  ));
}</textarea>
    <code-binding key="palette" type="select" carousel value="violet" options="red,green,blue,yellow,cyan,magenta,orange,chartreuse,spring-green,azure,violet,rose"></code-binding>
    <code-binding key="rowHeight" type="select" value="52" options="32,48,52,64"></code-binding>
    <code-binding key="containerEnabled" type="comment" value="false"></code-binding>
    <code-binding key="containerLight" type="color" value="#ff6b6b"></code-binding>
    <code-binding key="containerDark" type="color" value="#8b0000"></code-binding>
    <code-binding key="filledEnabled" type="comment" value="false"></code-binding>
    <code-binding key="filledLight" type="color" value="#4ecdc4"></code-binding>
    <code-binding key="filledDark" type="color" value="#006666"></code-binding>
    <code-binding key="tonalEnabled" type="comment" value="false"></code-binding>
    <code-binding key="tonalLight" type="color" value="#ffe66d"></code-binding>
    <code-binding key="tonalDark" type="color" value="#806600"></code-binding>
  </interactive-code>
</section>
