name: Deploy Demo to GitHub Pages
run-name: ${{ github.actor }} deploy demo on ${{ github.repository }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # dist/ must exist before install: package.json links @softwarity/row-actions
        # as "file:dist" (the locally built library).
        run: mkdir -p dist && npm ci

      # The demo consumes the LOCAL library (tsconfig paths → ../../dist), so the
      # deployed page always reflects the current source, not the npm release.
      - name: Build the library
        run: npm run build

      - name: Build demo for GitHub Pages
        run: npm run build:demo -- --base-href /row-actions/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/demo/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
